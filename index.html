 <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>ARELEI · Умный гардероб</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>
    :root {
      --bg1: #f2f2f7;
      --bg2: #ffffff;
      --glass: rgba(255, 255, 255, 0.82);
      --glass-strong: rgba(255, 255, 255, 0.96);
      --border-glass: rgba(255, 255, 255, 0.8);
      --primary: #007aff;
      --primary-soft: rgba(0, 122, 255, 0.12);
      --accent-pink: #ff2d55;
      --text-main: #111827;
      --text-muted: #8e8e93;
      --radius-lg: 26px;
      --radius-md: 18px;
      --shadow-soft: 0 20px 40px rgba(15, 23, 42, 0.25);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: radial-gradient(circle at top, #ffffff 0, #f2f2f7 55%, #e5e5ea 100%);
      color: var(--text-main);
      font-size: 15px;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .app {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      padding: env(safe-area-inset-top) 14px calc(72px + env(safe-area-inset-bottom)) 14px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      margin: auto;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #ffffff, rgba(0, 122, 255, 0.12), transparent 70%);
      filter: blur(6px);
      opacity: 0.9;
      z-index: -1;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-wrap {
      width: 38px;
      height: 38px;
      border-radius: 16px;
      background: conic-gradient(from 200deg,
        rgba(0, 122, 255, 0.25),
        rgba(255, 45, 85, 0.25),
        rgba(52, 199, 89, 0.25),
        rgba(0, 122, 255, 0.25)
      );
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
    }

    .logo-circle {
      width: 32px;
      height: 32px;
      border-radius: 14px;
      background: radial-gradient(circle at 30% 20%, #ffffff, #f2f2f7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 18px;
      font-weight: 800;
    }

    .brand-text-title {
      font-weight: 700;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: -0.02em;
    }

    .brand-text-title span.emoji {
      font-size: 20px;
    }

    .brand-text-sub {
      font-size: 13px;
      color: var(--text-muted);
    }

    .tg-user {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--border-glass);
      box-shadow: 0 12px 26px rgba(15, 23, 42, 0.22);
      font-size: 11px;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .tg-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #5ac8fa);
      color: #fff;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .tg-name {
      font-weight: 500;
    }

    .tg-tag {
      color: var(--text-muted);
      font-size: 10px;
    }

    .badge-status {
      margin: 0 4px 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.9);
      color: #0f5132;
      font-size: 11px;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.24);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .badge-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #34c759;
      box-shadow: 0 0 0 4px rgba(52, 199, 89, 0.22);
    }

    #screen {
      flex: 1;
      overflow-y: auto;
      padding: 4px 2px 8px;
      font-size: 14px;
    }

    #screen::-webkit-scrollbar {
      width: 4px;
    }

    #screen::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.6);
      border-radius: 999px;
    }

    .card {
      background: var(--glass);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-soft);
      padding: 14px 16px 16px;
      margin-bottom: 12px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 16px;
    }

    .card-title span {
      font-size: 20px;
    }

    .card-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .btn {
      border-radius: 999px;
      border: none;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: 0.15s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #5ac8fa);
      color: #fff;
      box-shadow: 0 14px 30px rgba(0, 122, 255, 0.7);
    }

    .btn-primary:active {
      transform: scale(0.97);
      box-shadow: 0 9px 20px rgba(0, 122, 255, 0.8);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.92);
      color: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.95);
    }

    .btn-ghost:active {
      transform: scale(0.97);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.18);
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 12px;
    }

    /* широкая кнопка в стилисте — чтобы не “съезжала” */
    .btn-full {
      width: 100%;
      justify-content: center;
      margin-top: 6px;
    }

    .notes {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.45;
    }

    .inputs {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    select,
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 9px 11px;
      border-radius: 14px;
      border: 1px solid rgba(120, 120, 128, 0.18);
      font-size: 14px;
      background: rgba(248, 248, 250, 0.96);
      color: var(--text-main);
      outline: none;
    }

    select:focus,
    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: rgba(0, 122, 255, 0.7);
      box-shadow: 0 0 0 1px rgba(0, 122, 255, 0.18);
      background: #ffffff;
    }

    .stat-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .stat {
      flex: 1;
      background: var(--glass-strong);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      padding: 8px 10px;
      font-size: 12px;
      box-shadow: 0 12px 26px rgba(15, 23, 42, 0.14);
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 11px;
      margin-bottom: 2px;
    }

    .stat-value {
      font-weight: 600;
      font-size: 17px;
    }

    .stat-note {
      font-size: 11px;
      color: #34c759;
      margin-top: 2px;
    }

    .ai-block {
      margin-top: 10px;
      padding: 9px 10px;
      border-radius: 18px;
      background: var(--glass-strong);
      border: 1px solid rgba(255, 255, 255, 0.98);
      font-size: 13px;
      box-shadow: 0 12px 26px rgba(15, 23, 42, 0.16);
    }

    .ai-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .ai-title {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 5px;
      font-size: 15px;
    }

    .ai-title span {
      font-size: 18px;
    }

    .ai-text {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 5px;
    }

    .ai-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .ai-tag {
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(0, 122, 255, 0.08);
      color: #004a99;
    }

    .quick-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .quick {
      background: var(--glass-strong);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.96);
      padding: 8px 6px;
      font-size: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: 0.15s ease;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.16);
    }

    .quick span.icon {
      font-size: 20px;
    }

    .quick:active {
      transform: scale(0.96);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.22);
    }

    .clothes-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .clothes-item {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--glass-strong);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.98);
      padding: 8px 10px;
      font-size: 13px;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.16);
    }

    .item-image {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      border-radius: 14px;
      background: #e5e5ea;
      object-fit: cover;
    }

    .clothes-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .clothes-name {
      font-weight: 500;
      font-size: 14px;
    }

    .clothes-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .chip {
      border-radius: 999px;
      padding: 3px 7px;
      font-size: 11px;
      background: rgba(242, 242, 247, 1);
      color: #3a3a3c;
    }

    .badge {
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(52, 199, 89, 0.14);
      color: #0f5132;
    }

    .ar-video,
    .ar-photo {
      width: 100%;
      border-radius: 20px;
      background: #000;
      max-height: 260px;
      object-fit: cover;
      box-shadow: 0 16px 34px rgba(15, 23, 42, 0.5);
    }

    .upload-row {
      margin-top: 9px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    input[type="file"] {
      font-size: 11px;
    }

    .discounts {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 7px;
      font-size: 12px;
    }

    .discount-card {
      border-radius: 18px;
      padding: 8px 10px;
      background: rgba(240, 249, 255, 0.98);
      border: 1px solid rgba(191, 219, 254, 0.96);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.15s ease;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.2);
    }

    .discount-card:active {
      transform: scale(0.97);
      box-shadow: 0 9px 18px rgba(15, 23, 42, 0.24);
    }

    .discount-brand {
      font-weight: 600;
      font-size: 13px;
    }

    .discount-info {
      color: #0f4c75;
      font-size: 12px;
    }

    .badge-link {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #084c61;
      color: #e0f2fe;
    }

    .bottom-nav {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 10px;
      padding: 8px 10px;
      background: rgba(22, 22, 24, 0.9);
      border-radius: 999px;
      display: flex;
      justify-content: space-between;
      gap: 4px;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .tab-btn {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: rgba(235, 235, 245, 0.78);
      font-size: 11px;
      padding: 5px 0 2px;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      transition: 0.15s ease;
    }

    .tab-btn span.icon {
      font-size: 19px;
    }

    .tab-btn.active {
      background: rgba(242, 242, 247, 1);
      color: #111827;
      box-shadow: 0 11px 24px rgba(15, 23, 42, 0.55);
    }

    .tab-btn.pro::after {
      content: "PRO";
      font-size: 8px;
      padding: 1px 5px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent-pink), #ff9f0a);
      color: #fff;
      margin-top: -1px;
    }

    .pill {
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(255, 149, 0, 0.14);
      color: #783506;
      font-size: 11px;
    }

    /* Онбординг */

    .onb-wrapper {
      min-height: calc(100vh - 150px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 0 12px;
    }

    .onb-card {
      width: 100%;
      max-width: 380px;
    }

    .steps {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .step-dots {
      display: inline-flex;
      gap: 5px;
    }

    .step-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: rgba(199, 199, 204, 0.7);
    }

    .step-dot.active {
      width: 18px;
      background: linear-gradient(135deg, var(--primary), #5ac8fa);
      box-shadow: 0 7px 18px rgba(0, 122, 255, 0.6);
    }

    .onb-emoji {
      font-size: 42px;
      margin-bottom: 6px;
    }

    .onb-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .onb-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.45;
    }

    .onb-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
    }

    .onb-buttons .btn {
      flex: 1;
      justify-content: center;
    }

    /* Погода авто-лейбл */
    .weather-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo-wrap">
          <div class="logo-circle">A</div>
        </div>
        <div>
          <div class="brand-text-title">
            <span class="emoji">👗</span> ARELEI
          </div>
          <div class="brand-text-sub">Умный гардероб с AR и ИИ-стилистом</div>
        </div>
      </div>
      <div class="tg-user">
        <div class="tg-avatar" id="tgAvatar">A</div>
        <div>
          <div class="tg-name" id="tgName">Гость</div>
          <div class="tg-tag" id="tgTag">Аккаунт Telegram привязан</div>
        </div>
      </div>
    </header>

    <div class="badge-status" id="statusBadge">
      <div class="badge-dot"></div>
      Free-план · ИИ-стилист доступен бесплатно 🤖
    </div>

    <div id="screen">
      Загрузка интерфейса...
    </div>

    <div class="bottom-nav">
      <button class="tab-btn active" data-tab="home" onclick="setTab('home')">
        <span class="icon">🏠</span>
        <span>Главная</span>
      </button>
      <button class="tab-btn" data-tab="wardrobe" onclick="setTab('wardrobe')">
        <span class="icon">👕</span>
        <span>Гардероб</span>
      </button>
      <button class="tab-btn" data-tab="ar" onclick="setTab('ar')">
        <span class="icon">📷</span>
        <span>AR</span>
      </button>
      <button class="tab-btn" data-tab="stylist" onclick="setTab('stylist')">
        <span class="icon">🤖</span>
        <span>Стилист</span>
      </button>
      <button class="tab-btn pro" data-tab="pro" onclick="setTab('pro')">
        <span class="icon">💎</span>
        <span>PRO</span>
      </button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "arelei-data-v3";

    const state = {
      tab: "home",
      pro: false,
      onboarded: false,
      onboardingStep: 1,
      profile: {
        age: null,
        city: "",
        goal: ""
      },
      clothes: [],
      discounts: [
        {
          brand: "OZON · BrandX",
          offer: "-15% на капсулу «Осень»",
          note: "для PRO-подписчиков 🌟"
        },
        {
          brand: "Wildberries · UrbanWear",
          offer: "-10% на базовые джинсы",
          note: "по рекомендациям стилиста 👖"
        }
      ]
    };

    let arStream = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (Array.isArray(data.clothes)) state.clothes = data.clothes;
        if (typeof data.pro === "boolean") state.pro = data.pro;
        if (typeof data.onboarded === "boolean") state.onboarded = data.onboarded;
        if (data.profile) state.profile = data.profile;
      } catch (e) {
        console.error(e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            clothes: state.clothes,
            pro: state.pro,
            onboarded: state.onboarded,
            profile: state.profile
          })
        );
      } catch (e) {
        console.error(e);
      }
    }

    function setTab(tab) {
      if (!state.onboarded && tab !== "home") {
        alert("Сначала пройдём краткую настройку — 3 быстрых шага 🙂");
        state.tab = "home";
        highlightTab("home");
        renderOnboarding(document.getElementById("screen"));
        return;
      }

      state.tab = tab;
      highlightTab(tab);
      renderScreen();
    }

    function highlightTab(tab) {
      document
        .querySelectorAll(".tab-btn")
        .forEach(btn => btn.classList.toggle("active", btn.dataset.tab === tab));
    }

    function renderScreen() {
      const root = document.getElementById("screen");
      if (!state.onboarded) {
        renderOnboarding(root);
        return;
      }
      if (state.tab === "home") renderHome(root);
      else if (state.tab === "wardrobe") renderWardrobe(root);
      else if (state.tab === "ar") renderAR(root);
      else if (state.tab === "stylist") renderStylist(root);
      else if (state.tab === "pro") renderPro(root);
    }

    /* ===== ОНБОРДИНГ ===== */

    function renderOnboarding(root) {
      const step = state.onboardingStep;
      let inner = "";

      if (step === 1) {
        inner = `
          <div class="onb-emoji">✨</div>
          <div class="onb-title">Давай познакомимся</div>
          <div class="onb-sub">
            ARELEI подстраивает гардероб и образы под твой возраст и образ жизни.
          </div>
          <div class="inputs">
            <div>
              <label for="ageInput">Сколько тебе лет?</label>
              <input id="ageInput" type="number" min="7" max="80"
                     placeholder="Например, 15" value="${state.profile.age || ""}" />
            </div>
          </div>
          <div class="onb-buttons">
            <button class="btn btn-ghost btn-sm" onclick="skipOnboarding()">
              Пропустить
            </button>
            <button class="btn btn-primary btn-sm" onclick="nextOnboardingStep()">
              Далее →
            </button>
          </div>
        `;
      } else if (step === 2) {
        inner = `
          <div class="onb-emoji">🎯</div>
          <div class="onb-title">Зачем тебе ARELEI?</div>

    function nextOnboardingStep() {
      if (state.onboardingStep === 1) {
        const ageEl = document.getElementById("ageInput");
        const age = parseInt(ageEl.value, 10);
        if (!age || age < 7 || age > 80) {
          alert("Введи, пожалуйста, реальный возраст (от 7 до 80).");
          return;
        }
        state.profile.age = age;
      } else if (state.onboardingStep === 2) {
        const goalEl = document.getElementById("goalSelect");
        const goal = goalEl.value;
        if (!goal) {
          alert("Выбери, пожалуйста, цель использования ARELEI.");
          return;
        }
        state.profile.goal = goal;
      }

      if (state.onboardingStep < 3) {
        state.onboardingStep += 1;
        renderOnboarding(document.getElementById("screen"));
      }
    }

    function prevOnboardingStep() {
      if (state.onboardingStep > 1) {
        state.onboardingStep -= 1;
        renderOnboarding(document.getElementById("screen"));
      }
    }

      if (!confirm("Пропустить настройку? Советы стилиста будут менее точными.")) return;
      state.onboarded = true;
      saveState();
      setTab("home");

      const cityEl = document.getElementById("cityInput");
      const city = cityEl.value.trim();

    async function startCamera() {
      try {
        const video = document.getElementById("arCamera");
        if (!video) return;
        arStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        video.srcObject = arStream;
      } catch (e) {
        alert("Не удалось включить камеру. Проверь разрешения в браузере/Telegram.");
        console.error(e);
      }
    }

    function stopCamera() {
      if (arStream) {
        arStream.getTracks().forEach(t => t.stop());
        arStream = null;
      }
    }

    function takePhoto() {
      const video = document.getElementById("arCamera");
      const canvas = document.getElementById("arSnapshot");
      if (!video || !canvas) return;
      if (!video.videoWidth || !video.videoHeight) {
        alert("Сначала включи камеру 🙂");
        return;
      }
      const w = video.videoWidth;
      const h = video.videoHeight;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, w, h);
      canvas.style.display = "block";

      const save = confirm("Сохранить фото как новую вещь?");
      if (!save) return;
      const name = prompt("Как назовём эту вещь?", "Новая вещь");
      if (!name) return;
      const dataUrl = canvas.toDataURL("image/jpeg");
      addClothesFromPhoto(name, dataUrl);
      alert("Вещь сохранена в гардероб. Открой вкладку «Гардероб», чтобы её увидеть.");
    }

      const input = document.getElementById("fileInput");

        alert("Выбери фото из галереи.");

      const file = input.files[0];

        const name = prompt("Название вещи для этого фото:", "Вещь с фото");

        const dataUrl = e.target.result;
        addClothesFromPhoto(name, dataUrl);
        alert("Фото добавлено как вещь в гардероб.");
      };
      reader.readAsDataURL(file);
    }

            </div>
          </div>
          <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn btn-primary btn-sm" onclick="startProPayment()">
              Оформить PRO 💳
            </button>
            <button class="btn btn-ghost btn-sm" onclick="setTab('home')">
              На главную
            </button>
          </div>
          <div class="notes">
            Сейчас кнопка просто включает/выключает режим PRO. В боевой версии здесь будет реальная оплата
            через Telegram Stars или другой платёжный метод.
          </div>
        </div>
      `;
    }

    function startProPayment() {
      state.pro = !state.pro;
      saveState();
      updateStatusBadge();
      alert(
        state.pro
          ? "В демо-режиме PRO активирован. Потом сюда подключим реальную оплату."
          : "PRO выключен."
      );
    }

    function updateStatusBadge() {
      const badge = document.getElementById("statusBadge");
      const proIconSpan = document.querySelector('.tab-btn.pro span.icon');

      if (state.pro) {
        badge.innerHTML = '<div class="badge-dot"></div> PRO-подписка активна 👑';
        if (proIconSpan) proIconSpan.textContent = "👑";
      } else {
        badge.innerHTML =
          '<div class="badge-dot"></div> Free-план · ИИ-стилист доступен бесплатно 🤖';
        if (proIconSpan) proIconSpan.textContent = "💎";
      }
    }

    /* ===== Авто-погода ===== */

    async function autoDetectWeather() {
      const label = document.getElementById("weatherAutoLabel");
      const select = document.getElementById("weatherSelect");
      if (!select || !label) return;

      if (!navigator.geolocation) {
        label.textContent = "Геолокация недоступна — выбери погоду вручную.";
        return;
      }

      label.textContent = "Запрашиваем геолокацию…";

      navigator.geolocation.getCurrentPosition(
        async pos => {
          try {
            const { latitude, longitude } = pos.coords;
            label.textContent = "Получаем температуру…";

            const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m`;
            const resp = await fetch(url);
            const data = await resp.json();
            const temp =
              data && data.current && typeof data.current.temperature_2m === "number"
                ? data.current.temperature_2m
                : null;

            if (temp === null) {
              label.textContent = "Не удалось получить погоду — выбери вручную.";
              return;
            }

            let mode;
            if (temp <= 10) mode = "cool";
            else if (temp <= 22) mode = "warm";
            else mode = "hot";

            select.value = mode;

            const textMode =
              mode === "cool" ? "прохладно" : mode === "warm" ? "тепло" : "жарко";

            label.textContent = `Погода: ${temp.toFixed(0)}° · ${textMode}`;
          } catch (e) {
            console.error(e);
            label.textContent = "Ошибка погоды — выбери вручную.";
          }
        },
        err => {
          console.warn(err);
          label.textContent = "Геолокация отклонена — выбери погоду вручную.";
        }
      );
    }

    /* ===== Telegram init ===== */

    function initTelegramUser() {
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          const data = window.Telegram.WebApp.initDataUnsafe;
          if (data && data.user) {
            const firstName = data.user.first_name || "";
            const lastName = data.user.last_name || "";
            const fullName = (firstName + " " + (lastName || "")).trim() || "Пользователь";
            const username = data.user.username ? "@" + data.user.username : "";

            const tgNameEl = document.getElementById("tgName");
            const tgAvatarEl = document.getElementById("tgAvatar");
            const tgTagEl = document.getElementById("tgTag");

            if (tgNameEl) tgNameEl.textContent = fullName;
            if (tgAvatarEl) tgAvatarEl.textContent = (firstName || "A").charAt(0).toUpperCase();
            if (tgTagEl)
              tgTagEl.textContent = username
                ? `Вход через Telegram ${username}`
                : "Аккаунт Telegram уже привязан";
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    /* ===== START ===== */

    document.addEventListener("DOMContentLoaded", function () {
      loadState();
      updateStatusBadge();
      initTelegramUser();

      if (!state.onboarded) {
        state.tab = "home";
        highlightTab("home");
        renderOnboarding(document.getElementById("screen"));
      } else {
        setTab("home");
      }
    });
  </script>
</body>
</html>
